<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}数据湖分片规划{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <h1><a href="{{ url_for('planner.index') }}">数据湖分片规划</a></h1>
    <p class="tagline">上传 Parquet 分区清单，按 worker 容量生成可交给并行作业的分片计划</p>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">计划一旦发布即不可变；同一清单重试返回原计划。</footer>
</body>
</html>
